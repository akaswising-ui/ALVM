name: Build AL Android APK

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

jobs:
  android-player:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android Player project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 35 and Build Tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-Android-Player-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
