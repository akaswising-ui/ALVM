plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alvmplayer'
    compileSdk 35

    defaultConfig {
        applicationId '{{APP_ID}}'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        // The exported native library is copied from the device's matching ABI.
        ndk {
            abiFilters '{{ABI}}'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
