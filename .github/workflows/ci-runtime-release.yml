name: Publish Rust CI Runtime release

on:
  push:
    tags:
      - "ci-runtime-v*"
    branches:
      - "runtime-release/2.0.1"
  workflow_dispatch:
    inputs:
      version:
        description: "Runtime version, for example 2.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;27.2.12479018"

      - name: Set Android NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Resolve runtime version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#ci-runtime-v}"
          else
            VERSION="2.0.1"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Runtime version must be major.minor.patch"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=ci-runtime-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Rust .ciruntime package for Android ABIs
        run: |
          chmod +x tools/package_ci_runtime.sh
          tools/package_ci_runtime.sh "${{ steps.version.outputs.value }}"

      - name: Publish Rust Runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.value }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/ci-runtime-$VERSION.ciruntime" "dist/ci-runtime-$VERSION.ciruntime.sha256" --clobber
          else
            gh release create "$TAG" \
              "dist/ci-runtime-$VERSION.ciruntime" \
              "dist/ci-runtime-$VERSION.ciruntime.sha256" \
              --title "Rust CI Runtime $VERSION" \
              --target "$GITHUB_SHA" \
              --notes "Rust CI Runtime package. Runtime API 1; .room format 9; Android ABIs arm64-v8a and armeabi-v7a."
          fi
