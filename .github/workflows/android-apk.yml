name: ALVM Android APK

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      source_file:
        description: "Repository path to the AL source (.al)"
        required: true
        default: "examples/calculator.al"
        type: string
      app_name:
        description: "Name shown below the Android app icon"
        required: true
        default: "AL Calculator"
        type: string
      application_id:
        description: "Android package ID"
        required: true
        default: "com.alvm.generated.calculator"
        type: string
      abi:
        description: "CPU architecture for the generated APK"
        required: true
        default: "arm64-v8a"
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      AL_SOURCE_FILE: ${{ github.event.inputs.source_file || 'examples/calculator.al' }}
      AL_APP_NAME: ${{ github.event.inputs.app_name || 'AL Calculator' }}
      AL_APPLICATION_ID: ${{ github.event.inputs.application_id || 'com.alvm.generated.calculator' }}
      AL_ABI: ${{ github.event.inputs.abi || 'arm64-v8a' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Android APK builder
        run: |
          python3 -m py_compile tools/build_android_apk.py tests/test_android_apk_builder.py
          python3 -m unittest discover -s tests -p 'test_android_apk_builder.py' -v

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build bundled offline Studio UI
        working-directory: studio-ui
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust Android targets and test the CI Runtime
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo fmt --manifest-path runtime/ci-runtime/Cargo.toml --all
          cargo test --manifest-path runtime/ci-runtime/Cargo.toml --all-targets

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile AL source and generate standalone Android APK
        run: |
          python3 tools/build_android_apk.py "$AL_SOURCE_FILE" \
            --source-root "$GITHUB_WORKSPACE" \
            --name "$AL_APP_NAME" \
            --application-id "$AL_APPLICATION_ID" \
            --abi "$AL_ABI" \
            --output dist/ALVM-standalone-player.apk

      - name: Upload generated Android Player APK
        uses: actions/upload-artifact@v4
        with:
          name: ALVM-Generated-Android-APK
          path: dist/ALVM-standalone-player.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ALVM Studio debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ALVM-Studio-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
