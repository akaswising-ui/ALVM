name: ALVM Build and Test
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python for CI Runtime tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure C++17 build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile ALVM
        run: cmake --build build --parallel 2
      - name: Run Python CI Runtime and C++ bytecode integration tests
        run: python tests/test_ci_runtime.py
      - name: Run compiler and VM regression tests
        run: ctest --test-dir build --output-on-failure
