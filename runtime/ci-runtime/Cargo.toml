[package]
name = "ci-runtime"
version = "2.2.0"
edition = "2021"
description = "Rust implementation of the ALVM CI Runtime for verified ALRM .room bytecode"
license = "BSL-1.0"

[lib]
name = "ci_runtime"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "ci-runtime"
path = "src/main.rs"

[[bin]]
name = "alpack"
path = "src/bin/alpack.rs"

[dependencies]
libloading = "0.8.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
